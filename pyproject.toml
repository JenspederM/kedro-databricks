[project]
name = "kedro-databricks"
version = "0.18.2"
description = "A plugin to run Kedro pipelines on Databricks."
authors = [{ name = "Jens Peder Meldgaard", email = "jenspederm@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "kedro>=0.19.7",
    "tomlkit>=0.13.0",
    "databricks-sdk>=0.36.0",
    "python-dotenv>=1.0.1",
    "packaging>=21.2",
    "fuso>=0.2.4",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
    "ruff>=0.7.2",
    "ty>=0.0.29",
    "zensical>=0.0.43",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-click>=0.9.0",
]
unit = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro-datasets[pandas, pandas.ParquetDataset]>=3.0",
    "numpy~=1.21",
]
integration = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro-datasets[spark, pandas, spark.SparkDatasetV2, pandas.ParquetDataset]>=9.1",
    "numpy~=1.21",
]

[project.urls]
Homepage = "https://github.com/jenspederm/kedro-databricks"
Issues = "https://github.com/jenspederm/kedro-databricks/issues"

[project.entry-points."kedro.project_commands"]
databricks = "kedro_databricks.plugin:commands"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kedro_databricks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    '--log-format="%(asctime)s %(levelname)s %(message)s"',
    '--log-date-format="%Y-%m-%d %H:%M:%S"',
    '--cov-report=term-missing',
    '--cov-report=xml:coverage.xml',
    '--junit-xml=coverage.junit.xml',
    '--cov=kedro_databricks',
    '--no-cov-on-fail',
    '--cov-fail-under=1',
    '--ignore-glob="develop-eggs/*"',
    '-ra',
    '-vv',
    '-x',
]

[tool.black]
exclude = ".*template.py"

[tool.coverage.report]
fail_under = 100
show_missing = true
omit = ["tests/*"]
exclude_also = ["raise NotImplementedError"]

[tool.ruff]
line-length = 88
show-fixes = true
lint.select = [
    "F",    # Pyflakes
    "W",    # pycodestyle
    "E",    # pycodestyle
    "I",    # isort
    "UP",   # pyupgrade
    "PL",   # Pylint
    "T201", # Print Statement
]
lint.ignore = ["E501", "PLR0913"] # Black takes care of line-too-long

[tool.ruff.lint.per-file-ignores]
"{tests,features}/*" = ["T201", "PLR2004", "PLR0915", "PLW1510"]
"src/kedro_databricks/commands/*" = ["PLR0917"]

[tool.ty.src]
include = ["src", "tests"]

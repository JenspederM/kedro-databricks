name: Integration Tests

on:
  workflow_call:
    inputs:
      codecov:
        type: boolean
        required: false
        default: false
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_CLIENT_ID:
        required: true
      DATABRICKS_CLIENT_SECRET:
        required: true
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      # Configure a constant location for the uv cache
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.uv-cache
          key: uv-integration-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-integration-${{ runner.os }}-
      - name: Sync kedro-databricks
        run: uv sync --group integration
      - name: Check kedro-databricks
        run: just check
      - name: Test kedro-databricks
        run: just test
        env:
          CUSTOM_USERNAME: "kedro_databricks"
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && inputs.codecov }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage reports to Codecov
        if: ${{ inputs.codecov }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Minimize uv cache
        run: uv cache prune --ci

name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - release-please--branches--main

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  dependency-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies & run tests
        run: |
          uv sync --all-extras --dev --resolution=${{ matrix.resolution }}
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        kedro_version: ["0.19.7", "0.19.8", "latest"]
    env:
      # Configure a constant location for the uv cache
      UV_CACHE_DIR: /tmp/.uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install lxml dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
      - name: Install dependencies
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Restore uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.uv-cache
          key: uv-unit-${{ runner.os }}-${{ matrix.kedro_version }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-unit-${{ runner.os }}-${{ matrix.kedro_version }}-${{ matrix.python-version }}-
      - name: Sync kedro-databricks
        run: |
          uv sync --group unit --python ${{ matrix.python-version }}
          if [ "${{ matrix.kedro_version }}" = "latest" ]; then
            uv pip install "kedro"
          else
            uv pip install "kedro==${{ matrix.kedro_version }}"
          fi
      - name: Check kedro-databricks
        run: just check
      - name: Test kedro-databricks
        run: just unittest
      - name: Rename coverage file
        run: mv coverage.junit.xml coverage-${{ matrix.kedro_version }}-${{ matrix.python-version }}.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.kedro_version }}-${{ matrix.python-version }}.junit.xml
          path: coverage-${{ matrix.kedro_version }}-${{ matrix.python-version }}.junit.xml
          if-no-files-found: ignore
      - name: Minimize uv cache
        run: uv cache prune --ci
  build-pr:
    name: Build PR artifact
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Create PR artifact
        run: |
          mkdir -p ./pr
          cp -r coverage ./pr/coverage
          cp ${{ github.event_path }} ./pr/event.json
          echo ${{ github.event.pull_request.number }} > ./pr/NR
          ls -la ./pr

      - name: Upload PR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr
          path: pr/
  valid:
    name: All checks pass
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - dependency-test
      - test
      - build-pr
    steps:
      - name: Check job results
        env:
          DEPENDENCY_RESULT: ${{ needs.dependency-test.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_PR_RESULT: ${{ needs.build-pr.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Dependency test: $DEPENDENCY_RESULT"
          echo "Unit tests: $TEST_RESULT"
          echo "PR artifact: $BUILD_PR_RESULT"
          [[ "$DEPENDENCY_RESULT" == "success" && "$TEST_RESULT" == "success" ]] &&
            [[ "$BUILD_PR_RESULT" == "success" || ( "$EVENT_NAME" == "push" && "$BUILD_PR_RESULT" == "skipped" ) ]]
